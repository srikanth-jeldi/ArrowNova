name: arrownova
description: "ArrowNova — sculpted arrow puzzles by EpitomeHub Technologies."
publish_to: 'none'
version: 0.2.10+12

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  audioplayers: ^6.8.0
  web_socket_channel: ^3.0.3
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: ArrowNovaSerif
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: ArrowNovaSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
  assets:
    - assets/branding/logo.png
    - assets/audio/
    - assets/art/
